name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # PR runs: HEAD is the merge commit, HEAD^1 the base (append-only gate)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci.yml

      - name: Cache the Qwen tokenizer used by --dry-run
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tokenizer-qwen2.5-0.5b-instruct-v1

      - name: Install CPU-only deps (requirements.txt + tokenizer-only transformers)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # finetune_qlora.py --dry-run needs only the tokenizer + chat template: no torch.
          # Same transformers pin as requirements-train.txt; jinja2 renders the chat template.
          pip install "transformers==5.12.1" jinja2

      - name: py_compile datagen/ training/ tools/ scripts/
        run: |
          for d in datagen training tools scripts; do
            if [ -d "$d" ]; then
              find "$d" -name '*.py' -print0 | xargs -0 -r python -m py_compile
            fi
          done

      - name: Prompt files are pure model-facing text (no HTML comments)
        run: |
          if grep -nH '<!--' prompts/*.txt; then
            echo "::error::prompts/*.txt không được chứa chú thích HTML — ghi chú trạng thái để trong prompts/README.md"
            exit 1
          fi
          echo "prompts: clean"

      - name: Contract 1 gate — validate_dataset.py on the public splits
        run: >
          python training/validate_dataset.py
          data/public/xlam_2k.train.jsonl
          data/public/xlam_2k.val.jsonl
          data/public/xlam_2k.test.jsonl

      - name: Contract 1 gate — finetune_qlora.py --dry-run (CPU, tokenizer only) has 0 rows over --max-len 2560
        run: |
          set -o pipefail
          python training/finetune_qlora.py --dry-run --data data/public/xlam_2k.train.jsonl --max-len 2560 | tee /tmp/dry_run.log
          grep -q "assert '<tools>' in prompt: OK" /tmp/dry_run.log
          grep -Eq "over_limit=0" /tmp/dry_run.log

      - name: Contract 2 smoke — eval_toolcall.py on sample_pred.jsonl (+ Markdown report)
        run: >
          python training/eval_toolcall.py
          --gold data/public/xlam_2k.eval.json
          --pred data/public/sample_pred.jsonl
          --preamble prompts/system_preamble_v0.txt
          --out /tmp/r.json --md /tmp/r.md

      - name: bootstrap_ci.py smoke (+ Markdown report)
        run: python training/bootstrap_ci.py --run a=/tmp/r.json --md /tmp/boot.md

      - name: check_provenance.py — fixtures and the reports just generated
        run: |
          IDX=tests/fixtures/index_fixture.md
          # hand-written fixtures: ok -> 0, bad -> 1
          python scripts/check_provenance.py tests/fixtures/report_ok.md --index $IDX
          if python scripts/check_provenance.py tests/fixtures/report_bad.md --index $IDX; then
            echo "::error::report_bad.md phải thoát mã 1"
            exit 1
          fi
          # a number glued to "pp" (+0.5pp) must be read as 0.5, not 0 (0 is indexed in this fixture) -> 1
          if python scripts/check_provenance.py tests/fixtures/report_pp_unindexed.md --index tests/fixtures/index_pp_fixture.md; then
            echo "::error::report_pp_unindexed.md phải thoát mã 1 (+0.5pp không được đọc thành 0)"
            exit 1
          fi
          # real eval_toolcall --md output: labels ('≥50% khoá') and the scorer string must NOT be flagged,
          # every accuracy in its tables IS checked and is indexed in the fixture INDEX -> 0
          python scripts/check_provenance.py tests/fixtures/eval_report_ok.md --index $IDX
          python scripts/check_provenance.py /tmp/r.md --index $IDX
          # real bootstrap_ci --md output: bare numbers under 'accuracy (%)' / '95% CI' must be detected -> 1
          if python scripts/check_provenance.py tests/fixtures/bootstrap_report_unindexed.md --index $IDX; then
            echo "::error::bootstrap_report_unindexed.md phải thoát mã 1 (số trần trong bảng chưa có dòng INDEX)"
            exit 1
          fi
          python scripts/check_provenance.py /tmp/boot.md --index $IDX > /tmp/prov_boot.log || true
          cat /tmp/prov_boot.log
          if ! grep -Eq "numbers=[1-9][0-9]*" /tmp/prov_boot.log; then
            echo "::error::check_provenance không phát hiện số nào trong báo cáo bootstrap_ci --md"
            exit 1
          fi
          # the real INDEX must parse; RUNLOG carries no numbers so this must exit 0
          python scripts/check_provenance.py results/RUNLOG.md

      - name: Contract 4 gate — validate_tools.py; tool_api_mapping.md is generated, never hand-edited
        run: |
          python tools/sgod/validate_tools.py
          python tools/sgod/gen_tool_api_mapping.py --check

      - name: Provenance gate — every committed report (findings/, docs/reports/, results/) is indexed and has 'Ghi chú trục đo'
        run: |
          fail=0
          while IFS= read -r f; do
            out=$(python scripts/check_provenance.py "$f") || fail=1
            printf '%s\n' "$out"
            if echo "$out" | grep -q "axis_note=no"; then
              echo "::error file=$f::thiếu dòng 'Ghi chú trục đo' ngay dưới tiêu đề (docs/contracts/eval_metric.md §6)"
              fail=1
            fi
          done < <(git -c core.quotePath=false ls-files 'findings/*.md' 'docs/reports/*.md' 'results/*.md' | grep -v -x -e 'results/INDEX.md' -e 'results/RUNLOG.md')
          exit $fail

      - name: training/recipes/results.csv keeps exactly the contract header
        run: |
          expected='arm,model,lora_rank,lr,completion_only,mask_fn_names,epochs,max_rows,seed,steps,wall_clock_min,gpu,tool_name_acc,param_acc,json_valid_rate,ci_lo,ci_hi,results_file,who,date'
          actual=$(head -1 training/recipes/results.csv | tr -d '\r')
          if [ "$actual" != "$expected" ]; then
            echo "::error file=training/recipes/results.csv::header khác hợp đồng (training/recipes/README.md §3) — không thêm/bớt cột"
            exit 1
          fi

      - name: results/INDEX.md + RUNLOG.md append-only; INDEX ids strictly increasing
        if: github.event_name == 'pull_request'
        run: |
          if git diff --unified=0 HEAD^1 HEAD -- results/INDEX.md results/RUNLOG.md | grep -E '^-\|'; then
            echo "::error::results/INDEX.md / RUNLOG.md chỉ được thêm dòng (append-only) — không sửa/xoá dòng cũ"
            exit 1
          fi
          python scripts/check_index_ids.py results/INDEX.md

      - name: Secret grep (SGOD credentials via repo secret, OpenAI-style keys)
        env:
          # Credential / internal-address patterns live ONLY in the repository secret SECRET_GREP_RE,
          # never in the repo: a public file must not spell out any part of a credential.
          SECRET_GREP_RE: ${{ secrets.SECRET_GREP_RE }}
        run: |
          SECRET_GREP_RE="$(printf '%s' "${SECRET_GREP_RE:-}" | tr -d '\r\n')"   # a stray newline would match every file
          # data/public/ is skipped on purpose: licensed third-party text (xLAM) that legitimately
          # contains sample e-mail addresses and must stay byte-identical.
          # -l prints file names only, so a hit never echoes a credential into the public CI log.
          if [ -z "${SECRET_GREP_RE:-}" ]; then
            echo "::error::Thiếu secret SECRET_GREP_RE của repo (PR từ fork không đọc được secret) — cần kiểm tay trước khi merge"
            exit 1
          fi
          if git grep -lIE "sk-[A-Za-z0-9]{20}|${SECRET_GREP_RE}" -- . ':!data/public'; then
            echo "::error::Phát hiện chuỗi giống bí mật trong repo — xoá và xoay khóa trước khi merge"
            exit 1
          fi
          echo "secret grep: clean"
