# Recipe "public_r8" — Thử nghiệm giảm LoRA rank xuống 8
arm: public_r8
notes: "0.5B, r8/alpha16, lr 1e-4, completion-only, 1 epoch, first 1000 rows, seed 42, max_len 2560 (T4 config)"

model: Qwen/Qwen2.5-0.5B-Instruct
lora_rank: 8            # rank = 8
lora_alpha: 16          # alpha = 16
lora_dropout: 0.05
lr: 1.0e-4              # learning rate = 1e-4
completion_only: 1      # chỉ tính loss phần completion
mask_fn_names: 0.0
epochs: 1
max_rows: 1000
seed: 42

# Cấu hình T4 cố định
batch_size: 4
grad_accum: 4
max_len: 2560
save_steps: 50
logging_steps: 10
