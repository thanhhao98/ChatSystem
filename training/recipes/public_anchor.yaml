# Recipe "public_anchor" — điểm neo (anchor) của lưới recipe F Việc 1 trên lát xLAM công khai.
# Mỗi khóa dưới đây = một cờ của training/finetune_qlora.py (dạng gạch dưới: --lora-rank -> lora_rank).
# Cờ gõ trên dòng lệnh luôn ghi đè giá trị trong file này. Các khóa `arm`, `notes` chỉ là metadata.
#
# Chạy:  python training/finetune_qlora.py --recipe training/recipes/public_anchor.yaml \
#            --data data/public/xlam_2k.train.jsonl --val data/public/xlam_2k.val.jsonl \
#            --output-dir runs/public_anchor_s42
arm: public_anchor
notes: "0.5B, r16/alpha32, lr 1e-4, completion-only, 1 epoch, first 1000 rows, seed 42, max_len 2560 (T4 config)"

model: Qwen/Qwen2.5-0.5B-Instruct
lora_rank: 16
lora_alpha: 32          # = 2 * lora_rank (giá trị mặc định nếu bỏ trống)
lora_dropout: 0.05
lr: 1.0e-4              # viết 1.0e-4 (không phải 1e-4) để YAML hiểu là số thực
completion_only: 1
mask_fn_names: 0.0
epochs: 1
max_rows: 1000          # lấy 1000 hàng ĐẦU của file train — mọi arm dùng cùng một lát cố định
seed: 42

# Cấu hình T4 cố định (không đổi giữa các arm)
batch_size: 4
grad_accum: 4
max_len: 2560           # = mặc định của finetune_qlora.py; dry-run 2026-09-13: hàng dài nhất trong lát 1000 = 2426 token
                        # (1536 chặn 5 hàng: pub-08f80ee0, pub-535a8a1b, pub-5ed8d874, pub-68439f03, pub-81a2d6d9)
save_steps: 50
logging_steps: 10
