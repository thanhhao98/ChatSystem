# Recipe "public_lr2e4" — arm thay đổi trục learning rate so với anchor.
# Trục thay đổi DUY NHẤT: lr 1e-4 → 2e-4.
# Mọi trục khác giữ nguyên anchor (0.5B, r16/α32, completion-only, 1 epoch, 1000 rows, seed 42).
#
# Chạy:  python training/finetune_qlora.py --recipe training/recipes/public_lr2e4.yaml \
#            --data data/public/xlam_2k.train.jsonl --val data/public/xlam_2k.val.jsonl \
#            --output-dir runs/public_lr2e4_s42
arm: public_lr2e4
notes: "0.5B, r16/alpha32, lr 2e-4, completion-only, 1 epoch, first 1000 rows, seed 42, max_len 2560 (T4 config)"

model: Qwen/Qwen2.5-0.5B-Instruct
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lr: 2.0e-4              # ← trục thay đổi duy nhất (anchor = 1.0e-4)
completion_only: 1
mask_fn_names: 0.0
epochs: 1
max_rows: 1000
seed: 42

# Cấu hình T4 cố định (không đổi giữa các arm)
batch_size: 4
grad_accum: 4
max_len: 2560
save_steps: 50
logging_steps: 10
